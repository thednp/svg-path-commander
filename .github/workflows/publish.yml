name: Publish to npm / jsr

on:
  release:
    types: [published] # Triggers on GitHub Release creation (with tag)

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read # For checkout
      id-token: write # Required for provenance / trusted publishing

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Sets up Vite+, the Node.js runtime, the package manager and the
      # dependency cache; `vp install` runs as part of the setup.
      # `registry-url` writes the npm auth config for the publish step.
      - name: Vite+ Setup
        uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: "26"
          cache: true
          run-install: '{"args":["--frozen-lockfile"]}'
          registry-url: "https://registry.npmjs.org"

      - name: Verify Vite+
        run: vp --version

      - name: Deno Setup
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install Playwright
        run: vp exec playwright install

      - name: Lint
        run: vpr lint

      - name: Build
        run: vpr build

      - name: Test
        run: vpr test

      # `--ignore-scripts` skips the `prepublishOnly` hook, which updates the
      # dependencies and the lockfiles; the release is built from the committed
      # sources instead.
      - name: Publish to npm
        run: vp pm publish --provenance --access public --no-git-checks -- --ignore-scripts # --access public for new/public packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }} # Only needed if NOT using trusted publishing

      - name: Publish to jsr
        # `--allow-dirty` is required because the build step regenerates the
        # committed `dist/` and `docs/` artifacts.
        run: deno publish --allow-dirty
        # env:
        #   Needed only if JSR OIDC (trusted publishing) is not enabled for this repo
        #   JSR_TOKEN: ${{ secrets.JSR_TOKEN }}
